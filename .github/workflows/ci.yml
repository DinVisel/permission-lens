name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:rule-docs
      - name: No network imports in core
        run: |
          if grep -RE "require\(['\"](fs|http|https|net|dns|child_process)['\"]\)|from ['\"]node:(fs|http|https|net|dns|child_process)['\"]" packages/core/dist; then
            echo "packages/core bundle references a banned Node/network API" >&2
            exit 1
          fi

  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @permissionlens/registry validate

  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: forge test
        working-directory: contracts
        run: |
          if [ -f foundry.toml ]; then forge test -vv; else echo "contracts/ not scaffolded yet — skipping"; fi
