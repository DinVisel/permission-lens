name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:rule-docs
      - name: No network imports in core
        run: |
          if grep -RE "require\(['\"](fs|http|https|net|dns|child_process)['\"]\)|from ['\"]node:(fs|http|https|net|dns|child_process)['\"]" packages/core/dist; then
            echo "packages/core bundle references a banned Node/network API" >&2
            exit 1
          fi

  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @permissionlens/registry validate

  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build
        working-directory: contracts
      - run: forge test -vv
        working-directory: contracts

  fixtures-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: forge script script/GenerateFixtures.s.sol -vvv
        working-directory: contracts
      - run: pnpm build:fixtures
      - name: Fail if regenerating fixtures produced a diff
        run: |
          git diff --exit-code -- fixtures/7702 || {
            echo "fixtures/7702 is out of date — run 'forge script script/GenerateFixtures.s.sol -vvv' (in contracts/) then 'pnpm build:fixtures' and commit the result." >&2
            exit 1
          }
